name: Build Android APK

on:
    push:
        branches:
            - master
        paths-ignore:
            - 'README.md'
            - '.github/ISSUE_TEMPLATE/*'
    workflow_dispatch:

concurrency:
    group: android-build
    cancel-in-progress: true

jobs:
    build-android:
        name: Build Android APK (release, prebuilt llama libs)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Install JS dependencies
              run: npm ci
              env:
                  EXPO_NO_TELEMETRY: '1'

            - name: Generate native Android project
              run: npx expo prebuild --platform android --clean
              env:
                  EXPO_NO_TELEMETRY: '1'
                  CI: '1'

            - name: Inject prebuilt llama.cpp native libs
              # cui-llama.rn builds llama.cpp/ggml from source only when
              # rnllamaBuildFromSource=true. With it OFF (default), CMake links
              # prebuilt libs from jniLibs/<ABI>/ and compiles only the small JNI
              # wrappers -> skips ~1h of C++ compilation.
              run: |
                  set -e
                  RN_DIR="node_modules/cui-llama.rn"
                  test -d "$RN_DIR" || { echo "cui-llama.rn not installed"; exit 1; }

                  # 1) core llama libs consumed by CMake (lib<name>.so per variant)
                  JNI_DIR="$RN_DIR/android/src/main/jniLibs/arm64-v8a"
                  mkdir -p "$JNI_DIR"
                  cp -v prebuilt/rnllama/arm64-v8a/*.so "$JNI_DIR/"

                  # 2) Hexagon HTP DSP skeletons -> npm package bin dir (used by the
                  #    copyhtp expo plugin) and directly into app assets (the plugin
                  #    already ran during prebuild, before these files existed).
                  BIN_DIR="$RN_DIR/bin/arm64-v8a"
                  mkdir -p "$BIN_DIR"
                  cp -v prebuilt/rnllama/htp/*.so "$BIN_DIR/"
                  ASSET_DIR="android/app/src/main/assets/ggml-hexagon"
                  mkdir -p "$ASSET_DIR"
                  cp -v prebuilt/rnllama/htp/*.so "$ASSET_DIR/"

                  echo "--- injected jniLibs ---"
                  ls -lh "$JNI_DIR"

            - name: Tune Gradle for CI
              working-directory: android
              run: |
                  set -e
                  # Force prebuilt-library mode and single ABI.
                  if grep -q '^rnllamaBuildFromSource=' gradle.properties; then
                    sed -i 's/^rnllamaBuildFromSource=.*/rnllamaBuildFromSource=false/' gradle.properties
                  else
                    echo 'rnllamaBuildFromSource=false' >> gradle.properties
                  fi
                  if grep -q '^reactNativeArchitectures=' gradle.properties; then
                    sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
                  else
                    echo 'reactNativeArchitectures=arm64-v8a' >> gradle.properties
                  fi
                  # R8 minification OOMs/hangs on the free runner with these large
                  # native libs; disable minify + resource shrinking for CI.
                  for k in android.enableProguardInReleaseBuilds android.enableShrinkResourcesInReleaseBuilds; do
                    if grep -q "^${k}=" gradle.properties; then
                      sed -i "s/^${k}=.*/${k}=false/" gradle.properties
                    else
                      echo "${k}=false" >> gradle.properties
                    fi
                  done
                  if grep -q '^org.gradle.jvmargs=' gradle.properties; then
                    sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
                  else
                    echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
                  fi
                  echo "--- effective gradle.properties ---"
                  grep -iE 'rnllama|reactNativeArchitectures|proguard|shrink|jvmargs' gradle.properties

            - name: Build release APK
              working-directory: android
              run: |
                  chmod +x ./gradlew
                  ./gradlew assembleRelease --no-daemon

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chatterui-android-apk
                  path: android/app/build/outputs/apk/**/*.apk
                  if-no-files-found: error
                  retention-days: 30
