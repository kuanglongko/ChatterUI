name: Build Android APK

on:
    push:
        branches:
            - master
        paths-ignore:
            - 'README.md'
            - '.github/ISSUE_TEMPLATE/*'
    workflow_dispatch:

concurrency:
    group: android-build
    cancel-in-progress: true

jobs:
    build-android:
        name: Build Android APK (release)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Install JS dependencies
              run: npm ci
              env:
                  EXPO_NO_TELEMETRY: '1'

            - name: Generate native Android project
              run: npx expo prebuild --platform android --clean
              env:
                  EXPO_NO_TELEMETRY: '1'
                  CI: '1'

            - name: Tune Gradle for CI
              working-directory: android
              run: |
                  set -e
                  echo "--- before ---"
                  grep -iE 'proguard|shrink|jvmargs|reactNativeArchitectures' gradle.properties || true
                  # Phones only need arm64-v8a. Building all 4 ABIs costs ~3/4 of the
                  # native C++ time on this llama.cpp / ggml heavy project.
                  if grep -q '^reactNativeArchitectures=' gradle.properties; then
                    sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' gradle.properties
                  else
                    echo 'reactNativeArchitectures=arm64-v8a' >> gradle.properties
                  fi
                  # R8 minification OOMs/hangs on the 7 GB free runner with these
                  # large native libs. Disable it (and resource shrinking) for CI.
                  if grep -q '^android.enableProguardInReleaseBuilds=' gradle.properties; then
                    sed -i 's/^android.enableProguardInReleaseBuilds=.*/android.enableProguardInReleaseBuilds=false/' gradle.properties
                  else
                    echo 'android.enableProguardInReleaseBuilds=false' >> gradle.properties
                  fi
                  if grep -q '^android.enableShrinkResourcesInReleaseBuilds=' gradle.properties; then
                    sed -i 's/^android.enableShrinkResourcesInReleaseBuilds=.*/android.enableShrinkResourcesInReleaseBuilds=false/' gradle.properties
                  else
                    echo 'android.enableShrinkResourcesInReleaseBuilds=false' >> gradle.properties
                  fi
                  if grep -q '^org.gradle.jvmargs=' gradle.properties; then
                    sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
                  else
                    echo 'org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> gradle.properties
                  fi
                  echo "--- after ---"
                  grep -iE 'proguard|shrink|jvmargs|reactNativeArchitectures' gradle.properties

            - name: Build release APK
              working-directory: android
              run: |
                  chmod +x ./gradlew
                  ./gradlew assembleRelease --no-daemon

            - name: Upload APK artifact
              uses: actions/upload-artifact@v4
              with:
                  name: chatterui-android-apk
                  path: android/app/build/outputs/apk/**/*.apk
                  if-no-files-found: error
                  retention-days: 30
